/* =========================================================
   KOMPONEN UI DASAR
   ========================================================= */
function makeButton(scene, x, y, w, h, label, onClick, fillColor) {
  const g = scene.add.graphics();
  g.fillStyle(fillColor !== undefined ? fillColor : COLORS.card, 1);
  g.fillRoundedRect(x - w / 2, y - h / 2, w, h, 10);
  g.lineStyle(1, COLORS.cardBorder, 1);
  g.strokeRoundedRect(x - w / 2, y - h / 2, w, h, 10);
  const t = scene.add.text(x, y, label, {
    fontFamily: "sans-serif", fontSize: "16px", color: "#ffffff", align: "center", wordWrap: { width: w - 24 }
  }).setOrigin(0.5);
  const zone = scene.add.zone(x, y, w, h).setInteractive({ useHandCursor: true });
  zone.on("pointerover", () => g.setAlpha(0.85));
  zone.on("pointerout", () => g.setAlpha(1));
  zone.on("pointerdown", () => { g.setAlpha(0.6); onClick(); });
  return { g, t, zone, destroyAll() { this.g.destroy(); this.t.destroy(); this.zone.destroy(); } };
}

function progressBarGfx(scene, x, y, w, h, ratio, color) {
  const bg = scene.add.graphics();
  bg.fillStyle(0x11141c, 1);
  bg.fillRoundedRect(x, y, w, h, h / 2);
  const fg = scene.add.graphics();
  const draw = (r) => {
    fg.clear();
    fg.fillStyle(color, 1);
    fg.fillRoundedRect(x, y, Math.max(4, w * Math.max(0, Math.min(1, r))), h, h / 2);
  };
  draw(ratio);
  fg.setData("redraw", draw);
  return fg;
}

/* =========================================================
   KARAKTER EKSPRESIF (shape-based avatar)
   Ekspresi: 'happy' | 'calm' | 'annoyed' | 'angry'
   ========================================================= */
class CharacterAvatar {
  constructor(scene, x, y, config) {
    this.scene = scene;
    this.color = config.color;
    this.radius = config.radius || 32;
    this.container = scene.add.container(x, y);
    this.body = scene.add.graphics();
    this.face = scene.add.graphics();
    this.container.add([this.body, this.face]);
    if (config.label) {
      this.label = scene.add.text(0, this.radius + 16, config.label, {
        fontFamily: "sans-serif", fontSize: "12px", color: "#ffffff", align: "center", wordWrap: { width: 140 }
      }).setOrigin(0.5);
      this.container.add(this.label);
    }
    this.setExpression(config.expression || "calm");
  }

  setExpression(expr) {
    const r = this.radius;
    this.body.clear();
    this.body.fillStyle(this.color, 1);
    this.body.fillCircle(0, 0, r);
    this.body.lineStyle(2, 0xffffff, 0.15);
    this.body.strokeCircle(0, 0, r);

    this.face.clear();
    const eyeY = -r * 0.15;
    const eyeDX = r * 0.35;
    const eyeR = r * 0.09;
    this.face.fillStyle(0x11141c, 1);
    this.face.fillCircle(-eyeDX, eyeY, eyeR);
    this.face.fillCircle(eyeDX, eyeY, eyeR);

    this.face.lineStyle(2, 0x11141c, 1);
    if (expr === "angry") {
      this.face.beginPath();
      this.face.moveTo(-eyeDX - eyeR * 1.6, eyeY - eyeR * 2.4);
      this.face.lineTo(-eyeDX + eyeR * 1.2, eyeY - eyeR * 0.6);
      this.face.strokePath();
      this.face.beginPath();
      this.face.moveTo(eyeDX + eyeR * 1.6, eyeY - eyeR * 2.4);
      this.face.lineTo(eyeDX - eyeR * 1.2, eyeY - eyeR * 0.6);
      this.face.strokePath();
    } else if (expr === "annoyed") {
      this.face.beginPath();
      this.face.moveTo(-eyeDX - eyeR, eyeY - eyeR * 1.6);
      this.face.lineTo(-eyeDX + eyeR, eyeY - eyeR * 1.0);
      this.face.strokePath();
      this.face.beginPath();
      this.face.moveTo(eyeDX + eyeR, eyeY - eyeR * 1.6);
      this.face.lineTo(eyeDX - eyeR, eyeY - eyeR * 1.0);
      this.face.strokePath();
    }

    const mouthY = r * 0.35;
    this.face.lineStyle(2.5, 0x11141c, 1);
    this.face.beginPath();
    if (expr === "happy") {
      this.face.arc(0, mouthY - 6, r * 0.32, Phaser.Math.DegToRad(20), Phaser.Math.DegToRad(160), false);
    } else if (expr === "calm") {
      this.face.moveTo(-r * 0.25, mouthY);
      this.face.lineTo(r * 0.25, mouthY);
    } else if (expr === "annoyed") {
      this.face.arc(0, mouthY + 8, r * 0.28, Phaser.Math.DegToRad(200), Phaser.Math.DegToRad(340), false);
    } else if (expr === "angry") {
      this.face.arc(0, mouthY + 14, r * 0.34, Phaser.Math.DegToRad(200), Phaser.Math.DegToRad(340), false);
      // uap kemarahan kecil
      this.face.lineStyle(2, 0xE24B4A, 0.8);
      this.face.beginPath();
      this.face.moveTo(r * 0.55, -r * 0.9);
      this.face.lineTo(r * 0.7, -r * 1.25);
      this.face.strokePath();
      this.face.beginPath();
      this.face.moveTo(r * 0.75, -r * 0.75);
      this.face.lineTo(r * 0.9, -r * 1.1);
      this.face.strokePath();
    }
    this.face.strokePath();
  }

  setLabel(text) { if (this.label) this.label.setText(text); }

  destroy() { this.container.destroy(); }
}

function expressionFromLevel(v) {
  // v: 0-100, semakin tinggi semakin "negatif" (marah/kesal)
  if (v >= 70) return "angry";
  if (v >= 35) return "annoyed";
  return "calm";
}
function expressionFromTrust(t) {
  // t: 0-100 kepercayaan publik, semakin tinggi semakin positif
  if (t >= 70) return "happy";
  if (t >= 40) return "calm";
  if (t >= 20) return "annoyed";
  return "angry";
}

   SCENE: LEVEL 3 — Palu Logika
   ========================================================= */
class Level3Scene extends Phaser.Scene {
  constructor() { super("Level3"); }
  create() {
    this.cameras.main.setBackgroundColor(COLORS.bg);
    this.idx = 0;
    this.lives = 3;
    this.add.text(400, 26, "Level 3: Palu Logika", { fontFamily: "sans-serif", fontSize: "18px", color: "#ffffff" }).setOrigin(0.5);
    this.livesText = this.add.text(400, 54, "", { fontFamily: "sans-serif", fontSize: "14px", color: "#F2A623" }).setOrigin(0.5);
    this.instrText = this.add.text(400, 80, "Klik frasa yang menunjukkan cacat logika pada kalimat berikut:", { fontFamily: "sans-serif", fontSize: "12px", color: "#888780", align: "center", wordWrap: { width: 560 } }).setOrigin(0.5);

    this.cardBg = this.add.graphics();
    this.wordContainer = this.add.container(0, 0);

    this.explainText = this.add.text(400, 340, "", { fontFamily: "sans-serif", fontSize: "13px", color: "#1D9E75", align: "center", wordWrap: { width: 560 } }).setOrigin(0.5);

    addModeratorBadge(this);
    this.updateLives();
    this.showItem();
  }
  updateLives() {
    this.livesText.setText("Nyawa palu: " + "\u25CF ".repeat(this.lives) + "\u25CB ".repeat(Math.max(0, 3 - this.lives)));
  }
  showItem() {
    const L3 = currentTopic().level3;
    this.explainText.setText("");
    this.wordContainer.removeAll(true);
    const item = L3.items[this.idx];
    this.cardBg.clear();
    this.cardBg.fillStyle(COLORS.card, 1);
    this.cardBg.fillRoundedRect(100, 130, 600, 150, 14);
    this.cardBg.lineStyle(1, COLORS.cardBorder, 1);
    this.cardBg.strokeRoundedRect(100, 130, 600, 150, 14);

    const targetStart = item.text.indexOf(item.target);
    const targetEnd = targetStart + item.target.length;

    let x = 130, y = 160, lineHeight = 26, maxWidth = 540;
    const startX = x;
    let charPointer = 0;
    item.text.split(" ").forEach((word) => {
      const wordStart = charPointer;
      const wordEnd = wordStart + word.length;
      charPointer = wordEnd + 1;

      const belongsToTarget = targetStart !== -1 && wordStart < targetEnd && wordEnd > targetStart;

      const wordObj = this.add.text(x, y, word + " ", {
        fontFamily: "sans-serif", fontSize: "14px", color: "#ffffff"
      });
      if (belongsToTarget) {
        wordObj.setColor("#FAC775");
        wordObj.setInteractive({ useHandCursor: true });
        wordObj.on("pointerdown", () => this.correctClick(item));
      } else {
        wordObj.setInteractive();
        wordObj.on("pointerdown", () => this.wrongClick());
      }
      this.wordContainer.add(wordObj);
      x += wordObj.width;
      if (x > startX + maxWidth) { x = startX; y += lineHeight; }
    });
  }
  correctClick(item) {
    this.explainText.setColor("#1D9E75").setText("Tepat! " + item.explain);
    GameState.level3.correct++;
    GameState.level3.total++;
    this.advance();
  }
  wrongClick() {
    this.lives--;
    GameState.level3.misses++;
    GameState.level3.total++;
    this.updateLives();
    this.explainText.setColor("#E24B4A").setText("Belum tepat, coba cari frasa yang menyerang pribadi atau melompat kesimpulan.");
    if (this.lives <= 0) {
      this.time.delayedCall(1200, () => this.scene.start("Level4"));
    }
  }
  advance() {
    const L3 = currentTopic().level3;
    this.time.delayedCall(1400, () => {
      this.idx++;
      if (this.idx >= L3.items.length || this.lives <= 0) {
        this.scene.start("Level4");
      } else {
        this.showItem();
      }
    });
  }
}

  create() {
    this.cameras.main.setBackgroundColor(COLORS.bg);
    this.step = 0;
    this.choice = { A: null, B: null, C: null };
    this.add.text(400, 30, "Level 4: Konklusi Agung", { fontFamily: "sans-serif", fontSize: "20px", color: "#ffffff" }).setOrigin(0.5);
    this.instrText = this.add.text(400, 62, "", { fontFamily: "sans-serif", fontSize: "13px", color: "#888780" }).setOrigin(0.5);

    this.previewBg = this.add.graphics();
    this.previewText = this.add.text(400, 130, "", {
      fontFamily: "sans-serif", fontSize: "14px", color: "#ffffff", align: "center", wordWrap: { width: 560 }
    }).setOrigin(0.5);

    this.optionButtons = [];
    addModeratorBadge(this);
    this.showStep();
  }
  slotLabel() { return ["A", "B", "C"][this.step]; }
  slotData() {
    const L4 = currentTopic().level4;
    return [L4.slotA, L4.slotB, L4.slotC][this.step];
  }
  showStep() {
    this.optionButtons.forEach(b => b.destroyAll());
    this.optionButtons = [];
    this.instrText.setText(`Pilih kalimat untuk slot ${this.slotLabel()} (${this.step + 1}/3)`);
    this.renderPreview();
    const opts = this.slotData();
    opts.forEach((opt, i) => {
      const btn = makeButton(this, 400, 260 + i * 80, 600, 64, opt.text, () => this.select(opt));
      this.optionButtons.push(btn);
    });
  }
  renderPreview() {
    const L4 = currentTopic().level4;
    const A = this.choice.A ? this.choice.A.text : "___(A)___";
    const B = this.choice.B ? this.choice.B.text : "___(B)___";
    const C = this.choice.C ? this.choice.C.text : "___(C)___";
    const text = L4.template.replace("{A}", A).replace("{B}", B).replace("{C}", C);
    this.previewBg.clear();
    this.previewBg.fillStyle(COLORS.card, 1);
    this.previewBg.fillRoundedRect(100, 95, 600, 70, 14);
    this.previewText.setPosition(400, 130).setText(text);
  }
  select(opt) {
    this.choice[this.slotLabel()] = opt;
    GameState.level4.neutralityScore += opt.score;
    this.step++;
    if (this.step >= 3) {
      this.renderPreview();
      this.time.delayedCall(1500, () => this.scene.start("Level5"));
    } else {
      this.showStep();
    }
  }
}

/* =========================================================
   SCENE: LEVEL 5 — Konferensi Pers Darurat
   ========================================================= */
class Level5Scene extends Phaser.Scene {
  constructor() { super("Level5"); }
  create() {
    this.cameras.main.setBackgroundColor(COLORS.bg);
    this.idx = 0;
    this.add.text(400, 24, "Level 5: Konferensi Pers Darurat", { fontFamily: "sans-serif", fontSize: "17px", color: "#ffffff" }).setOrigin(0.5);

    this.wartawan = new CharacterAvatar(this, 90, 90, { color: 0xEF9F27, radius: 28, expression: expressionFromTrust(GameState.level5.trust), label: "Wartawan" });

    this.add.text(280, 55, "Kepercayaan publik", { fontFamily: "sans-serif", fontSize: "12px", color: "#888780" });
    this.trustBar = progressBarGfx(this, 280, 68, 260, 12, GameState.level5.trust / 100, 0x378ADD);
    this.trustLabel = this.add.text(550, 65, GameState.level5.trust + "%", { fontFamily: "sans-serif", fontSize: "12px", color: "#ffffff" });

    // baris kerumunan warga kecil, warnanya mengikuti tingkat kepercayaan
    this.crowd = [];
    for (let i = 0; i < 6; i++) {
      const dot = this.add.circle(650 + i * 20, 60, 7, 0x888780);
      this.crowd.push(dot);
    }
    this.updateCrowd();

    this.qBg = this.add.graphics();
    this.qText = this.add.text(400, 150, "", { fontFamily: "sans-serif", fontSize: "15px", color: "#ffffff", align: "center", wordWrap: { width: 560 } }).setOrigin(0.5);

    this.optionButtons = [];
    this.feedbackText = this.add.text(400, 440, "", { fontFamily: "sans-serif", fontSize: "13px", color: "#F2A623", align: "center", wordWrap: { width: 560 } }).setOrigin(0.5);

    addModeratorBadge(this);
    this.showQuestion();
  }
  updateCrowd() {
    const t = GameState.level5.trust;
    const color = t >= 60 ? 0x1D9E75 : t >= 35 ? 0xF2A623 : 0xE24B4A;
    this.crowd.forEach(dot => dot.setFillStyle(color));
  }
  showQuestion() {
    const L5 = currentTopic().level5;
    this.feedbackText.setText("");
    this.optionButtons.forEach(b => b.destroyAll());
    this.optionButtons = [];
    const item = L5.questions[this.idx];
    this.qBg.clear();
    this.qBg.fillStyle(COLORS.card, 1);
    this.qBg.fillRoundedRect(100, 105, 600, 90, 14);
    this.qText.setPosition(400, 150).setText('Wartawan: "' + item.q + '"');

    item.options.forEach((opt, i) => {
      const btn = makeButton(this, 400, 240 + i * 65, 600, 54, opt.text, () => this.answer(opt));
      this.optionButtons.push(btn);
    });
  }
  answer(opt) {
    const L5 = currentTopic().level5;
    GameState.level5.trust = Math.max(0, Math.min(100, GameState.level5.trust + opt.trust));
    this.trustBar.getData("redraw")(GameState.level5.trust / 100);
    this.trustLabel.setText(Math.round(GameState.level5.trust) + "%");
    this.wartawan.setExpression(expressionFromTrust(GameState.level5.trust));
    this.updateCrowd();
    this.feedbackText.setColor(opt.trust >= 0 ? "#1D9E75" : "#E24B4A")
      .setText(opt.trust >= 0 ? "Publik menganggap jawabanmu netral dan berdasar data." : "Publik mulai meragukan objektivitasmu.");
    this.time.delayedCall(1300, () => {
      this.idx++;
      if (this.idx >= L5.questions.length) {
        this.scene.start("Result");
      } else {
        this.showQuestion();
      }
    });
  }
}

/* =========================================================
   SCENE: RESULT — Indeks Kredibilitas
   ========================================================= */
class ResultScene extends Phaser.Scene {
  constructor() { super("Result"); }
  create() {
    this.cameras.main.setBackgroundColor(COLORS.bg);
    this.add.text(400, 36, "Indeks Kredibilitas Jurnalis", { fontFamily: "sans-serif", fontSize: "22px", color: "#F2A623" }).setOrigin(0.5);
    this.add.text(400, 62, "Topik: " + currentTopic().topicName, { fontFamily: "sans-serif", fontSize: "13px", color: "#888780" }).setOrigin(0.5);

    const akurasi = this.computeAkurasi();
    const ketenangan = this.computeKetenangan();
    const netralitas = this.computeNetralitas();
    const total = Math.round(akurasi * 0.4 + ketenangan * 0.3 + netralitas * 0.3);

    this.drawMetric(220, 140, "Akurasi", akurasi, 0x378ADD);
    this.drawMetric(400, 140, "Ketenangan", ketenangan, 0xF2A623);
    this.drawMetric(580, 140, "Netralitas", netralitas, 0x1D9E75);

    this.add.text(400, 240, `Total Indeks Kredibilitas: ${total}%`, { fontFamily: "sans-serif", fontSize: "20px", color: "#ffffff" }).setOrigin(0.5);

    const badges = this.computeBadges(akurasi, ketenangan, netralitas);
    this.add.text(400, 280, "Lencana diperoleh:", { fontFamily: "sans-serif", fontSize: "14px", color: "#888780" }).setOrigin(0.5);
    this.add.text(400, 308, badges.length ? badges.join("   ") : "(belum ada lencana, coba lagi!)", {
      fontFamily: "sans-serif", fontSize: "13px", color: "#F2A623", align: "center", wordWrap: { width: 620 }
    }).setOrigin(0.5);

    makeButton(this, 400, 400, 260, 54, "Kembali ke Menu", () => this.scene.start("Menu"));
  }
  computeAkurasi() {
    const l1 = GameState.level1.total ? GameState.level1.correct / GameState.level1.total : 0;
    const l2 = GameState.level2.total ? GameState.level2.correct / GameState.level2.total : 0;
    const l3 = GameState.level3.total ? GameState.level3.correct / GameState.level3.total : 0;
    return Math.round(((l1 + l2 + l3) / 3) * 100);
  }
  computeKetenangan() {
    const rageMax = Math.max(GameState.level2.proRage, GameState.level2.kontraRage);
    const rageScore = 100 - rageMax;
    const missPenalty = Math.max(0, 100 - GameState.level3.misses * 25);
    return Math.round((rageScore + missPenalty) / 2);
  }
  computeNetralitas() {
    const conclusionScore = (GameState.level4.neutralityScore / GameState.level4.neutralityMax) * 100;
    const trustScore = GameState.level5.trust;
    return Math.round((conclusionScore + trustScore) / 2);
  }
  computeBadges(akurasi, ketenangan, netralitas) {
    const badges = [];
    const suffix = currentTopic().topicName;
    const l1full = GameState.level1.total > 0 && GameState.level1.correct === GameState.level1.total;
    if (l1full) badges.push("Detektif Fakta: " + suffix);
    if (GameState.level2.proRage === 0 && GameState.level2.kontraRage === 0 && GameState.level3.misses === 0) badges.push("Kepala Dingin: " + suffix);
    if (GameState.level3.total > 0 && GameState.level3.misses === 0) badges.push("Penghancur Sesat Pikir: " + suffix);
    if (netralitas >= 95) badges.push("Diplomat Muda: " + suffix);
    return badges;
  }
  drawMetric(x, y, label, value, color) {
    const g = this.add.graphics();
    g.fillStyle(COLORS.card, 1);
    g.fillRoundedRect(x - 80, y - 50, 160, 100, 14);
    this.add.text(x, y - 25, label, { fontFamily: "sans-serif", fontSize: "13px", color: "#888780" }).setOrigin(0.5);
    this.add.text(x, y + 5, value + "%", { fontFamily: "sans-serif", fontSize: "26px", color: "#ffffff" }).setOrigin(0.5);
    progressBarGfx(this, x - 60, y + 30, 120, 8, value / 100, color);
  }
}

/* =========================================================
   KONFIGURASI GAME
   ========================================================= */
const config = {
  type: Phaser.AUTO,
  width: 800,
  height: 500,
  parent: "game-container",
  backgroundColor: "#1b1f2a",
  scene: [MenuScene, Level1Scene, Level2Scene, Level3Scene, Level4Scene, Level5Scene, ResultScene]
};

new Phaser.Game(config);
</script>
